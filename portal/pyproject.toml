[project]
name = "dxlab-portal"
version = "0.1.0"
description = "Tầng 2/3 – giao diện H-P-D-I và ứng dụng báo hỏng thiết bị phòng lab"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    # Prefab còn ở giai đoạn pre-1.0: bản minor có thể phá vỡ API, nên ghim chính xác.
    "prefab-ui==0.21.1",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

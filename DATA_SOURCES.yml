version: "1.0.0"
title: "Bảng kê nguồn gốc dữ liệu mẫu DX-Lab (Data Sources Manifest)"
description: >
  Tài liệu công bố nguồn gốc, bản quyền và độ toàn vẹn của các tập dữ liệu mẫu
  dùng cho phát triển, kiểm thử và demo trong dự án DX-Lab.
  Toàn bộ dữ liệu do nhóm phát triển tự biên soạn, giả định theo cây tổ chức trong docs/AUTHZ.md,
  không sử dụng thông tin cá nhân thật và không sao chép tài liệu có bản quyền.

default_license: "CC-BY-4.0"
copyright_holder: "DX-Lab contributors"
year: 2026


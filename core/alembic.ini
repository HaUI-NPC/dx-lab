# Dùng khi phát triển: `cd core && uv run alembic revision --autogenerate -m "<mô tả>"`.
# URL database lấy từ biến DXLAB_DATABASE_URL (xem src/dxlab_core/db/migrations/env.py).
[alembic]
script_location = %(here)s/src/dxlab_core/db/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

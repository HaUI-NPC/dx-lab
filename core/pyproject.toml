[project]
name = "dxlab-core"
version = "0.1.0"
description = "Tầng 1 – DX-OS Open-Core headless: định danh, dữ liệu, workflow qua REST API"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

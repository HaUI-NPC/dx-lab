[project]
name = "dxlab-mcp"
version = "0.2.1"
description = "Máy chủ MCP stdio cho DX-Lab"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["fastmcp>=2.10,<4", "httpx>=0.27"]

[project.scripts]
dxlab-mcp = "dxlab_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
